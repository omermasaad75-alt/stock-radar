name: scan

on:
  schedule:
    - cron: "0 12 * * 1-5"    # قبل افتتاح السوق الأمريكي
    - cron: "30 21 * * 1-5"   # بعد إغلاق السوق الأمريكي
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit data.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json
          [ -f docs/data.json ] && git add docs/data.json || true
          git diff --cached --quiet || (git commit -m "data: update $(date -u '+%F %H:%M')" && git push)
